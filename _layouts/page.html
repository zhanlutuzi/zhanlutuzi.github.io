---
layout: default
---

<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title | escape }}</h1>
    {% if page.description %}
      <p class="post-meta">{{ page.description }}</p>
    {% endif %}
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  {% if page.comments %}
    <div class="post-content">
      <h2>留言</h2>
      {% include comments.html %}
    </div>
  {% endif %}
</article>
